[workspace]
members = ["crates/engine", "crates/wasm", "crates/python", "crates/server"]
default-members = ["crates/engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
nested-chess = { path = "crates/engine" }

[profile.release]
lto = true
opt-level = "s"
