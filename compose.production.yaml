services:
  proxy:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to your public hostname}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [proxy]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.5
volumes:
  caddy_data:
  caddy_config:
