[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "nested-chess"
version = "0.1.0"
requires-python = ">=3.10"
description = "King-capture chess on a routed grid of boards"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
module-name = "nested_chess"
