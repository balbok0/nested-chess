name: Shared server
on:
  push:
    branches: [feat/shared-backend, feat/mobile-ux, feat/elo-matchmaking, feat/rectangular-grid, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci_compose_password
      PUBLIC_URL: http://localhost:8080
      UI_BASE_URL: http://localhost:8080
      TEST_POSTGRES_CONTAINER: nested-chess-db-1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up --build -d --wait
      - run: node scripts/check-compose.mjs
      - run: npm run test:ui
      - run: docker compose logs --tail 100
        if: failure()
      - run: docker compose down
        if: always()
