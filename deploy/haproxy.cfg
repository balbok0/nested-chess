global
    log stdout format raw local0
    maxconn 10000
    nbthread 2
defaults
    log global
    mode http
    retries 2
    option redispatch 1
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 5s
frontend web
    bind :8080
    acl online path_beg /api/ /auth/
    use_backend rust if online
    default_backend assets
backend rust
    balance roundrobin
    option httpchk GET /api/v1/ready
    http-check expect status 200
    http-response set-header X-Nested-Replica %[srv_name]
    default-server check inter 2s fall 2 rise 1 resolvers docker init-addr libc,none
    server app-a app-a:4180
    server app-b app-b:4180
backend assets
    balance roundrobin
    option httpchk GET /api/v1/health
    http-check expect status 200
    http-response set-header X-Nested-Replica %[srv_name]
    default-server check inter 2s fall 2 rise 1 resolvers docker init-addr libc,none
    server app-a app-a:4180
    server app-b app-b:4180
